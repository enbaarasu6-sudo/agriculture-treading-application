{% extends 'base.html' %}{% block title %}Edit Produce · AgriDirect{% endblock %}{% block content %}<div class="section-heading"><div><div class="eyebrow">YOUR FARM STORE</div><h1>Edit produce</h1><p class="muted">Update your listing and inventory details.</p></div><a href="{{url_for('farmer_home')}}">← Dashboard</a></div><form method="post"><label>Product name<input name="name" value="{{ product['name'] }}" required></label><label>Category<select name="category">{% for c in ['Vegetables','Fruits','Grains','Spices'] %}<option {% if product['category']==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><label>Quantity<input name="quantity" type="number" min="0" value="{{product['quantity']}}" required></label><label>Unit<select name="unit">{% for u in ['kg','bundle','box'] %}<option {% if product['unit']==u %}selected{% endif %}>{{u}}</option>{% endfor %}</select></label><label>Price per unit (₹)<input name="price" type="number" min="0.01" step="0.01" value="{{product['price']}}" required></label><label>Harvested<select name="harvested">{% for h in ['Today','Yesterday','Recently'] %}<option {% if product['harvested']==h %}selected{% endif %}>{{h}}</option>{% endfor %}</select></label><button class="button full">Save changes</button></form>{% endblock %}
