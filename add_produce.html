{% extends 'base.html' %}{% block title %}Add Produce · AgriDirect{% endblock %}{% block content %}<div class="section-heading"><div><div class="eyebrow">YOUR FARM STORE</div><h1>Add produce</h1><p class="muted">Create a clear listing customers can understand quickly.</p></div><a href="{{url_for('farmer_home')}}">← Dashboard</a></div><form method="post"><label>Product name<input name="name" placeholder="Example: Fresh Brinjal" required></label><label>Category<select name="category"><option>Vegetables</option><option>Fruits</option><option>Grains</option><option>Spices</option></select></label><label>Quantity<input name="quantity" type="number" min="1" required></label><label>Unit<select name="unit"><option>kg</option><option>bundle</option><option>box</option></select></label><label>Price per unit (₹)<input name="price" type="number" min="1" step="0.01" required></label><label>Harvested<select name="harvested"><option>Today</option><option>Yesterday</option><option>Recently</option></select></label><button class="button full">Save produce</button></form>{% endblock %}
